[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partstash"
version = "0.1.0"
description = "Turn messy Taobao / JLCPCB purchase orders into a searchable electronic-component inventory dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["inventory", "electronics", "bom", "kicad", "streamlit", "components", "jlcpcb"]
authors = [{ name = "PartStash contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business",
]
dependencies = [
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "plotly>=5.24.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/94xhn/partstash"
Repository = "https://github.com/94xhn/partstash"
Issues = "https://github.com/94xhn/partstash/issues"

[tool.hatch.build.targets.wheel]
packages = ["partstash"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# A pragmatic default: pyflakes + pycodestyle + isort + bugbear.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
]
